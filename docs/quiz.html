<!DOCTYPE html>

<html lang="mr"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1" name="viewport"/>

<style>
:root { --bg:#f8fafc; --card:#fff; --ink:#0f172a; --muted:#475569; --line:#e2e8f0; --accent:#7c3aed; --ok:#16a34a; --bad:#dc2626; --blue:#2563eb; }
@media (prefers-color-scheme: dark) { :root { --bg:#0b1220; --card:#131c2e; --ink:#e2e8f0; --muted:#94a3b8; --line:#253349; } }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--ink); font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; line-height:1.6; }
.wrap { max-width:900px; margin:0 auto; padding:28px 20px 60px; }
a { color:var(--blue); } h1 { font-size:1.9rem; }
.sub { color:var(--muted); }
.scorebox { position:sticky; top:0; background:var(--bg); padding:10px 0; z-index:5; }
.score { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 16px; font-weight:700; }
.qcard { background:var(--card); border:1px solid var(--line); border-left:6px solid var(--accent); border-radius:14px; padding:18px 20px; margin-top:16px; }
.qcard h3 { font-size:1.02rem; margin-bottom:10px; }
.opt { display:block; width:100%; text-align:left; margin-top:8px; padding:10px 14px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--ink); font:inherit; cursor:pointer; }
.opt:hover { border-color:var(--accent); }
.opt.right { border-color:var(--ok); background:color-mix(in srgb, var(--ok) 12%, var(--bg)); }
.opt.wrong { border-color:var(--bad); background:color-mix(in srgb, var(--bad) 12%, var(--bg)); }
.why { display:none; margin-top:10px; color:var(--muted); font-size:.92rem; border-top:1px dashed var(--line); padding-top:8px; }
.reset { margin-top:20px; background:var(--accent); color:#fff; border:none; border-radius:10px; padding:10px 18px; font:inherit; font-weight:700; cursor:pointer; }
footer { margin-top:44px; border-top:1px solid var(--line); padding-top:16px; color:var(--muted); font-size:.88rem; }
</style>

<style id="i18n-css">
#lang-pick{position:fixed;top:10px;right:10px;z-index:9999;font:600 .85rem -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--card,#fff);color:var(--ink,#0f172a);border:1px solid var(--line,#e2e8f0);border-radius:999px;padding:6px 12px;box-shadow:0 2px 10px rgba(0,0,0,.08);cursor:pointer}
html[lang="mr"] body{font-family:"Noto Sans Devanagari","Mukta","Devanagari Sangam MN","Nirmala UI",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
html[lang="mr"] svg text{font-family:"Noto Sans Devanagari","Mukta","Devanagari Sangam MN","Nirmala UI",sans-serif}
.i18n-en{display:block;font-size:.86em;line-height:1.35;color:var(--muted,#64748b);font-weight:400;margin-top:2px;font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.i18n-en.i{display:inline;margin:0 0 0 .3em;font-size:.92em;opacity:.85}
.i18n-en.i::before{content:"· "}
h1 .i18n-en,h2 .i18n-en{font-size:.58em;margin-top:4px} h3 .i18n-en{font-size:.78em}
.lab .i18n-en,.wk .i18n-en{color:inherit;opacity:.85}
html[lang="mr"] .i18n-en{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
@media print{#lang-pick{display:none}}
</style><style id="navfab-css">
#navfab{position:fixed;right:18px;bottom:18px;z-index:9000;display:flex;flex-direction:column;align-items:flex-end;gap:10px;font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
#navfab button.fb{border:0;cursor:pointer;border-radius:999px;box-shadow:0 6px 18px rgba(15,23,42,.28);display:flex;align-items:center;gap:8px;font-weight:700}
#navfab .fb-main{background:var(--accent,#2563eb);color:#fff;height:52px;padding:0 18px 0 16px;font-size:1rem}
#navfab .fb-main span.ic{font-size:1.35rem}
#navfab .fb-top{background:var(--card,#fff);color:var(--ink,#0f172a);width:44px;height:44px;justify-content:center;font-size:1.2rem;border:1px solid var(--line,#e2e8f0);opacity:0;pointer-events:none;transition:opacity .2s}
#navfab .fb-top.on{opacity:1;pointer-events:auto}
#navpanel{position:fixed;right:18px;bottom:84px;z-index:9001;width:min(380px,calc(100vw - 36px));max-height:min(72vh,640px);display:none;flex-direction:column;background:var(--card,#fff);color:var(--ink,#0f172a);border:1px solid var(--line,#e2e8f0);border-radius:16px;box-shadow:0 18px 50px rgba(15,23,42,.35);overflow:hidden;font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
#navpanel.on{display:flex}
#navpanel .nh{padding:12px 14px 8px;border-bottom:1px solid var(--line,#e2e8f0)}
#navpanel .nh b{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.95rem;margin-bottom:8px}
#navpanel .nx{border:0;background:none;color:var(--muted,#64748b);font-size:1.1rem;cursor:pointer;padding:2px 6px;border-radius:8px}
#navpanel input{width:100%;box-sizing:border-box;padding:8px 10px;border-radius:10px;border:1px solid var(--line,#cbd5e1);background:var(--bg,#f8fafc);color:var(--ink,#0f172a);font-size:.9rem}
#navpanel .nb{overflow:auto;padding:6px 8px 10px}
#navpanel .ng{font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted,#64748b);margin:10px 8px 4px}
#navpanel a{display:flex;gap:8px;align-items:baseline;padding:7px 10px;border-radius:9px;color:var(--ink,#0f172a);text-decoration:none;font-size:.9rem;line-height:1.3}
#navpanel a:hover{background:color-mix(in srgb,var(--accent,#2563eb) 10%,transparent)}
#navpanel a.cur{background:color-mix(in srgb,var(--accent,#2563eb) 16%,transparent);font-weight:700}
#navpanel a .nn{flex:none;min-width:26px;text-align:center;font-weight:800;color:var(--accent,#2563eb)}
#navpanel a small{display:block;font-size:.76rem;color:var(--muted,#64748b);font-weight:500;margin-top:1px}
@media (max-width:640px){#navfab{right:12px;bottom:12px}#navfab .fb-main .lb{display:none}#navfab .fb-main{width:52px;padding:0;justify-content:center}
 #navpanel{left:0;right:0;bottom:0;width:auto;max-height:78vh;border-radius:18px 18px 0 0}}
@media print{#navfab,#navpanel{display:none!important}}
</style>
</head><body><select aria-label="Language / भाषा" id="lang-pick" onchange="schoolSetLang(this.value)">
<option value="both">🇮🇳🇬🇧 मराठी + English</option><option value="mr">🇮🇳 मराठी</option><option value="en">🇬🇧 English</option></select><div class="wrap">
<p data-en='&lt;a href="index.html"&gt;← Back to the course home&lt;/a&gt;'><a href="index.html">← कोर्सच्या मुख्य पानाकडे परत</a></p>
<h1 data-en="🧪 The 🧠 AI quiz">🧪 🧠 AI प्रश्नमंजुषा</h1>
<p class="sub" data-en="10 questions — pick an answer, get the why. One attempt per question (until reset).
Your best score is saved in this browser.">10 प्रश्न — उत्तर निवडा, कारण मिळवा. प्रत्येक प्रश्नाला एकच प्रयत्न (reset पर्यंत). तुमचा सर्वोत्तम गुण या ब्राउझरमध्ये जपला जातो.</p>
<div class="scorebox"><div class="score" data-en="0 / 10 · best: —" id="score">0 / 10 · सर्वोत्तम: —</div></div>
<div id="quiz"></div>
<button class="reset" data-en="↺ Reset &amp;amp; retake" onclick="reset()">↺ Reset &amp; पुन्हा द्या</button>
<footer data-en='Part of &lt;a href="https://baluraut.github.io/school/"&gt;🏫 The School&lt;/a&gt; · &lt;a href="index.html"&gt;course home&lt;/a&gt;'><a href="https://baluraut.github.io/school/">🏫 द स्कूल</a> चा भाग · <a href="index.html">कोर्स मुख्य पान</a></footer>
</div>
<script>
var QS = [{"q": "An LLM's one actual job?", "o": ["Understand grammar", "Predict the next token, repeatedly", "Query a knowledge database"], "c": 1, "w": "L05: the sentence-completion game — everything else emerges from it."}, {"q": "Temperature ≈ 0 gives you…", "o": ["Smarter answers", "The most likely token every time — consistent, safe", "Faster responses"], "c": 1, "w": "L05: the dial trades safety for adventure; code wants ~0."}, {"q": "Why is 'count the R's in strawberry' hard?", "o": ["Models can't count at all", "It sees learned token-pieces, never letters", "Berries are ambiguous"], "c": 1, "w": "L03: [st][raw][berry]-ish IDs — the sensory system has no letters."}, {"q": "Embeddings are…", "o": ["Compression", "Meaning as coordinates — similar meanings sit close", "Encryption"], "c": 1, "w": "L04: the seating chart; distance = similarity powers search and RAG."}, {"q": "What does attention do?", "o": ["Speeds up training", "Lets each token weigh every other token — 'it' → ball 69%", "Filters bad words"], "c": 1, "w": "L06: weighted glancing, many heads, many layers."}, {"q": "RLHF in one line?", "o": ["More data", "Humans pick better answers → a taste-judge → the model gets nudged toward it", "Bigger context"], "c": 1, "w": "L07: gold stars — where helpfulness AND sycophancy come from."}, {"q": "LoRA is…", "o": ["A new model", "Tiny trainable add-on notes on a frozen model (~0.1%)", "A prompt format"], "c": 1, "w": "L07: sticky notes — cheap, swappable personalization."}, {"q": "New company facts should come from…", "o": ["Fine-tuning", "RAG — facts on the desk; tune for style, not facts", "A bigger model"], "c": 1, "w": "L10: the rule of rules — facts→RAG, style→tune."}, {"q": "Why do models hallucinate?", "o": ["Bugs", "Trained for plausibility — truth was never in the loss", "Not enough RAM"], "c": 1, "w": "L09: the confident kid; defenses are open-book, receipts, permission to not know."}, {"q": "The context window is best thought of as…", "o": ["Long-term memory", "The desk — everything must fit; oldest pages slide off", "A cache"], "c": 1, "w": "L08: no desk, no existence; 'memory' is the app re-pasting notes."}];
var KEY='quiz-ai-school', answered={}, score=0;
var best = parseInt(localStorage.getItem(KEY)||'-1');
function render() {
  var el = document.getElementById('quiz'); el.innerHTML='';
  QS.forEach(function(q,i) {
    var card=document.createElement('div'); card.className='qcard';
    card.innerHTML='<h3>'+(i+1)+'. '+q.q+'</h3>';
    q.o.forEach(function(opt,j) {
      var b=document.createElement('button'); b.className='opt'; b.textContent=opt;
      b.onclick=function() {
        if (answered[i]!==undefined) return;
        answered[i]=j;
        if (j===q.c) { b.classList.add('right'); score++; }
        else { b.classList.add('wrong'); card.querySelectorAll('.opt')[q.c].classList.add('right'); }
        card.querySelector('.why').style.display='block';
        update();
      };
      card.appendChild(b);
    });
    var why=document.createElement('div'); why.className='why'; why.textContent='💡 '+q.w;
    card.appendChild(why);
    el.appendChild(card);
  });
}
function update() {
  var done=Object.keys(answered).length;
  if (done===QS.length && score>best) { best=score; localStorage.setItem(KEY,best); }
  document.getElementById('score').textContent=score+' / '+QS.length+(done===QS.length?' — done! 🎓':'')+' · best: '+(best<0?'—':best+'/'+QS.length);
}
function reset() { answered={}; score=0; render(); update(); }
render(); update();
</script>

<script id="i18n-js">
var I18N_INLINE={A:1,SPAN:1,CODE:1,B:1,I:1,EM:1,STRONG:1,BUTTON:1,LABEL:1,SUMMARY:1,SMALL:1,KBD:1};
function schoolSetLang(l){
  if(l!=='en'&&l!=='mr'&&l!=='both') l='both';
  try{localStorage.setItem('school-lang2',l)}catch(e){}
  document.documentElement.setAttribute('lang', l==='en' ? 'en' : 'mr');
  document.querySelectorAll('[data-en]').forEach(function(el){
    if(!el.hasAttribute('data-mr')) el.setAttribute('data-mr', el.innerHTML);
    var en=el.getAttribute('data-en'), mr=el.getAttribute('data-mr');
    var svg = el.namespaceURI && el.namespaceURI.indexOf('svg')>-1;
    if(svg){
      el.innerHTML = (l==='en') ? en : mr;
      var t=el.querySelector('title'); if(t) t.remove();
      if(l==='both'){ t=document.createElementNS('http://www.w3.org/2000/svg','title'); t.textContent=en.replace(/<[^>]+>/g,''); el.insertBefore(t, el.firstChild); }
      return;
    }
    if(l==='en') el.innerHTML = en;
    else if(l==='mr') el.innerHTML = mr;
    else if(en.replace(/\s+/g,' ').trim()===mr.replace(/\s+/g,' ').trim()) el.innerHTML = mr;
    else {
      var e2=en.replace(/<span class="(ln|num|wk)">[\s\S]*?<\/span>\s*/g,'');
      if(e2.charAt(0)!=='<' && mr.charAt(0)!=='<'){           /* drop the prefix both languages share, e.g. "01 · 🏢 " */
        var i=0; while(i<e2.length&&i<mr.length&&e2.charAt(i)===mr.charAt(i)) i++;
        var cut=e2.lastIndexOf(' ',i); if(cut>0 && cut<e2.length-1) e2=e2.slice(cut+1);
      }
      el.innerHTML = mr + '<span class="i18n-en'+(I18N_INLINE[el.tagName]?' i':'')+'">'+e2+'</span>';
    }
  });
  document.querySelectorAll('[data-en-ph]').forEach(function(el){
    if(!el.hasAttribute('data-mr-ph')) el.setAttribute('data-mr-ph', el.getAttribute('placeholder'));
    el.setAttribute('placeholder', (l==='en') ? el.getAttribute('data-en-ph') : (l==='mr' ? el.getAttribute('data-mr-ph') : el.getAttribute('data-mr-ph')+' / '+el.getAttribute('data-en-ph')));
  });
  var p=document.getElementById('lang-pick'); if(p) p.value=l;
}
(function(){ var l='both'; try{ l=localStorage.getItem('school-lang2')||'both'; }catch(e){}
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',function(){schoolSetLang(l)}); else schoolSetLang(l); })();
</script><div id="navfab-js"><script>
(function(){
const PAGES=[["index.html", "🏠 Course home", "🏠 कोर्स मुख्य पान"], ["lesson-diagrams.html", "🖼️ All lesson diagrams", "🖼️ सर्व धड्यांच्या आकृत्या"], ["quiz.html", "🧪 Quiz", "🧪 प्रश्नमंजुषा"], ["study-plan.html", "🗓️ Study plan", "🗓️ अभ्यास योजना"], ["before-and-tradeoffs.html", "⚖️ Before & trade-offs", "⚖️ आधी आणि फायदे-तोटे"]], PORTAL="https://baluraut.github.io/school/", HERE=location.pathname.split('/').pop()||'index.html';
const mr=()=> (document.documentElement.lang||'').startsWith('mr');
const L=(en,m)=> mr()? m+' · '+en.replace(/^[^\w\s(]+\s+/,'') : en;
const fab=document.createElement('div');fab.id='navfab';
fab.innerHTML='<button class="fb fb-top" aria-label="Back to top">↑</button><button class="fb fb-main" aria-label="Topics"><span class="ic">🧭</span><span class="lb">Topics</span></button>';
const pan=document.createElement('div');pan.id='navpanel';pan.setAttribute('role','dialog');
document.body.appendChild(pan);document.body.appendChild(fab);
const top=fab.querySelector('.fb-top'),main=fab.querySelector('.fb-main');
const txt=e=>(e.textContent||'').replace(/\s+/g,' ').trim();
function items(){  // every lesson section and every page-level heading, in page order
  const out=[];const seen=new Set();let k=0;
  document.querySelectorAll('h2:not([id]), .school > h3').forEach(h=>{if(h.closest('section.dsec,#navpanel,#zoomov'))return;const host=h.matches('.school > h3')?h.parentElement:h;if(!host.id)host.id='nav-'+(++k)});
  document.querySelectorAll('section.dsec[id], h2[id], section[id] > h2, .school[id]').forEach(e=>{
    const sec=e.matches('section')?e:(e.closest('section.dsec')||null);
    const target=sec&&sec.id?sec:e; if(!target.id||seen.has(target.id))return;
    if(!sec&&e.closest('#navpanel,#zoomov'))return;
    seen.add(target.id);
    const h=sec?(sec.querySelector('h2,h3')||sec):(e.matches('.school')?(e.querySelector('h3')||e):e); const ln=h.querySelector&&h.querySelector('.ln');
    const c=h.cloneNode(true); const en=c.querySelector&&c.querySelector('.i18n-en'); const et=en?txt(en):''; if(en)en.remove();
    const lnc=c.querySelector&&c.querySelector('.ln'); let n=''; if(lnc){n=txt(lnc); lnc.remove()}
    let t=txt(c); if(!t)return; const cut=x=>x.length>90?x.slice(0,88)+'…':x;
    out.push({id:target.id,n,t:cut(t),e:et&&et!==t?cut(et):''});
  });
  return out;
}
let cur=null;
function build(){
  const its=items();const q=(pan.querySelector('input')||{}).value||'';
  const here=its.map(i=>`<a href="#${i.id}" data-id="${i.id}" class="${i.id===cur?'cur':''}"><span class="nn">${i.n||'•'}</span><span>${i.t}${i.e?`<small>${i.e}</small>`:''}</span></a>`).join('');
  const pages=PAGES.filter(p=>p[0]!==HERE).map(p=>`<a href="${p[0]}"><span>${L(p[1],p[2])}</span></a>`).join('');
  pan.innerHTML=`<div class="nh"><b>🧭 ${L('Jump to a topic','विषयावर जा')}<button class="nx" aria-label="close">✕</button></b><input type="search" placeholder="${mr()?'शोधा · filter…':'filter…'}" value="${q.replace(/"/g,'&quot;')}"></div>
   <div class="nb">${its.length?`<div class="ng">${L('On this page','या पानावर')}</div><div class="here">${here}</div>`:''}
   ${pages?`<div class="ng">${L('Other pages','इतर पाने')}</div>${pages}`:''}
   ${PORTAL?`<div class="ng">${L('The School','शाळा')}</div><a href="${PORTAL}"><span>🏫 ${L('All schools','सर्व शाळा')}</span></a>`:''}</div>`;
  const inp=pan.querySelector('input');inp.addEventListener('input',()=>{const v=inp.value.toLowerCase();pan.querySelectorAll('.nb a').forEach(a=>{a.style.display=!v||a.textContent.toLowerCase().includes(v)?'':'none'})});
  inp.dispatchEvent(new Event('input'));
}
function open(){build();pan.classList.add('on');const c=pan.querySelector('a.cur');if(c)c.scrollIntoView({block:'center'});setTimeout(()=>{if(innerWidth>640)pan.querySelector('input').focus()},30)}
function close(){pan.classList.remove('on')}
main.addEventListener('click',e=>{e.stopPropagation();pan.classList.contains('on')?close():open()});
pan.addEventListener('click',e=>{if(e.target.closest('.nx')){close();return}const a=e.target.closest('a');if(a&&a.getAttribute('href').startsWith('#'))close();e.stopPropagation()});
document.addEventListener('click',close);document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
top.addEventListener('click',()=>scrollTo({top:0,behavior:'smooth'}));
addEventListener('scroll',()=>{top.classList.toggle('on',scrollY>600)},{passive:true});
if('IntersectionObserver' in window){const io=new IntersectionObserver(es=>{es.forEach(en=>{if(en.isIntersecting){cur=en.target.id;pan.querySelectorAll('.here a').forEach(a=>a.classList.toggle('cur',a.dataset.id===cur))}})},{rootMargin:'-35% 0px -60% 0px'});
 items().forEach(i=>{const t=document.getElementById(i.id);if(t)io.observe(t)})}
})();
</script></div><!--/navfab-js-->
